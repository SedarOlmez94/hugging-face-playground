name: Bug Report
description: Report a problem with Clive
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the
        sections below so we can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: The exact commands you ran and what happened.
      placeholder: |
        1. clive ollama serve --detach
        2. clive session --model qwen2.5-coder:latest
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: input
    id: clive-version
    attributes:
      label: Clive version
      description: Output of `clive --version`
    validations:
      required: true

  - type: input
    id: ollama-version
    attributes:
      label: Ollama version
      description: Output of `ollama --version`
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: Model in use
      placeholder: qwen2.5-coder:latest
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that might help us understand the issue.
    validations:
      required: false
